name: verify

# 每次推送 / PR / 手动：把"改了几何或网页就必须重跑"的验证链自动跑一遍，
# 免得像之前那样把黑屏、干涉、取景这些回归问题带进 Pages。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    # 尺寸断言 + 姿态干涉检查 + 网页矩阵数学和 python 对答案
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: python -m pip install --quiet numpy

      - name: 姿态干涉检查（内含 params.sanity 尺寸断言）
        run: python check_poses.py

      - name: viewer 矩阵数学 vs poses.pose
        run: node web/verify_matrix.js

  web:
    # 自动取景 + 真的用桩跑一遍 viewer 的 JS（抓黑屏这类运行期异常）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 自动取景
        run: node web/verify_framing.js

      - name: 运行期冒烟
        run: node web/verify_runtime.js

  docs:
    # docs/ 是网页演示的发布源，必须是 web/ 的忠实拷贝
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 重新生成 docs/ 并检查有没有落后
        run: |
          python make_docs.py
          if git diff --quiet -- docs; then
            echo "docs/ 与 web/ 一致"
          else
            echo "::error::docs/ 落后于 web/，请在本地跑 python make_docs.py 后提交"
            git diff --stat -- docs
            exit 1
          fi
